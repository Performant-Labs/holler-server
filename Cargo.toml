[package]
name = "holler-server"
version = "0.1.0"
edition = "2021"
description = "Your agents are just a holler away"
license = "Proprietary"

[lib]
name = "holler_server"
path = "src/lib.rs"

# Integration tests are auto-discovered only from tests/<name>.rs or
# tests/<name>/. A file nested deeper (tests/wire/selftest.rs) is NOT
# discovered. Pin the canary's path explicitly so `cargo test` runs it.
# Issue #41: "a silent skip is a fail."
[[test]]
name = "wire_selftest"
path = "tests/wire/selftest.rs"

# Issue #28: the protocol v1 codec test (auto-discoverable, pinned here
# for consistency with the canary).
[[test]]
name = "proto_test"
path = "tests/proto_test.rs"

# Issue #40: the ACP stub (ADR 0012: a tiny fake agent speaking ACP v1 /
# JSON-RPC 2.0 over stdio). Pinned like the tests above because it lives
# under tests/wire/, not src/, so it is not auto-discovered. Builds to
# `stub-acp` (cargo appends `.exe` on Windows). The harness
# (tests/wire/first_talk.rs) locates the built binary and spawns it
# directly — no `CARGO_BIN_EXE_stub_acp` (see common/mod.rs for why).
[[bin]]
name = "stub-acp"
path = "tests/wire/stub_acp.rs"

# Issue #29: first CLI entry point in this crate (`holler token ...`).
[[bin]]
name = "holler"
path = "src/main.rs"

# Issue #40: the OS-portable process harness scaffold (the #31 e2e slots
# into this). Nested under tests/wire/, so it is not auto-discovered — pin
# it so `cargo test` runs it.
[[test]]
name = "first_talk"
path = "tests/wire/first_talk.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Issue #29: first CLI entry point in this crate (`holler token ...`).
# clap's derive API scales cleanly to the sibling subcommands #35 adds
# later (status/support/roster/say) without restructuring this shape.
clap = { version = "4", features = ["derive"] }
# Issue #29 (ADR 0010): CSPRNG for the 256-bit join secret and token_id.
# Lower-level than the `rand` crate (no RNG-trait ceremony) since all we
# need is raw OS entropy.
getrandom = "0.2"
# Issue #29 (ADR 0010): HMAC-SHA-256(pepper, secret) at rest.
hmac = "0.12"
sha2 = "0.10"
# Issue #29: real timestamp arithmetic for TTL/expires/last_seen (unlike
# the wire codec's opaque, never-parsed `ts` — this genuinely needs to
# compute and compare RFC3339 instants). `time` chosen over `chrono` for
# its smaller dependency footprint; only the `formatting`/`parsing`
# features are enabled (no `local-offset`, which is unsound in
# multi-threaded processes and unneeded since everything here is UTC).
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "rt", "signal"] }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", features = ["sink"] }
hostname = "0.4.2"

# Test-only dependencies. `libc` is used by the first_talk harness to kill
# a child's whole process group on Unix (`setpgid` at spawn, `killpg` +
# `SIGKILL` at kill) — the portable "kill the tree, not just SIGTERM"
# idiom. Not needed by the stub (serde_json covers it) or the lib.
[dev-dependencies]
libc = "0.2"
tempfile = "3"
