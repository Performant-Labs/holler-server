name: interop

# Issue #94: a real cross-platform interop test harness — a `holler-server`
# on Linux talking over a real network (through a Cloudflare quick tunnel)
# to a real `holler-client` on macOS and on Windows. See the issue's
# "Design decided — recording before implementation" comment for the full
# rationale.
#
# Manual dispatch only, deliberately: this spins up two GitHub-hosted
# macOS/Windows runners (billed at ~10x/~2x the Linux per-minute rate) plus
# a public Cloudflare tunnel, none of which should run on every push/PR.
# Whether to add an automatic trigger later (e.g. on release tags) is an
# open question this workflow does not answer — flagging it rather than
# deciding it here.
on:
  workflow_dispatch: {}
  # TEMPORARY, verification-only: `workflow_dispatch` cannot be invoked via
  # API/CLI for a workflow that only exists on a non-default branch (a hard
  # GitHub constraint), so this branch-scoped `push` trigger lets this PR's
  # own branch actually run the workflow in CI for real iteration before
  # merge. Removed before this PR is finalized.
  push:
    branches: [feature/94-interop-harness]

env:
  # A fixed, non-secret pepper (ADR 0009's HMAC pepper for token hashing).
  # This is safe only because this server exists for the lifetime of one
  # CI job and its token store is discarded with the runner — never do
  # this for a real deployment, where HOLLER_SERVER_PEPPER must be a real,
  # unpublished secret.
  HOLLER_SERVER_PEPPER: "ci-interop-harness-fixed-pepper-not-a-secret"
  HOLLER_PORT: "41807"

jobs:
  # Builds and runs the real `holler-server`, exposes it to the internet
  # via a Cloudflare quick tunnel (TLS-terminating, so the client legs
  # dial a real wss:// URL per ADR-0004), mints one join token per client
  # job, then does the actual protocol-level verification (roster/say/
  # interrupt) once both client jobs have had a chance to join — see the
  # module note on `HOLLER_STATE_DIR`'s control channel below for why the
  # verification happens here and not on the client legs themselves.
  linux-server:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      tunnel_url: ${{ steps.tunnel.outputs.url }}
      macos_token: ${{ steps.tokens.outputs.macos_token }}
      windows_token: ${{ steps.tokens.outputs.windows_token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable

      - name: Build holler-server
        run: cargo build --release

      - name: Set up an isolated state dir
        run: echo "HOLLER_STATE_DIR=${{ runner.temp }}/holler-interop-state" >> "$GITHUB_ENV"

      - name: Start holler serve
        run: |
          mkdir -p "$HOLLER_STATE_DIR"
          ./target/release/holler serve --listen "127.0.0.1:${HOLLER_PORT}" \
            > /tmp/holler-serve.log 2>&1 &
          echo $! > /tmp/holler-serve.pid

          for i in $(seq 1 30); do
            grep -q "listening on" /tmp/holler-serve.log && break
            sleep 1
          done
          cat /tmp/holler-serve.log
          grep -q "listening on" /tmp/holler-serve.log || { echo "::error::holler serve never reported listening"; exit 1; }

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

      - name: Start cloudflared quick tunnel
        id: tunnel
        run: |
          /tmp/cloudflared tunnel --url "http://127.0.0.1:${HOLLER_PORT}" \
            > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          # cloudflared prints the trycloudflare.com URL to stderr (both
          # captured above) after a short, variable delay — poll rather
          # than assume it's instant.
          url=""
          for i in $(seq 1 30); do
            url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            if [ -n "$url" ]; then break; fi
            sleep 2
          done

          if [ -z "$url" ]; then
            echo "::error::cloudflared did not print a trycloudflare.com URL within budget"
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "tunnel url: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Mint join tokens for the client jobs
        id: tokens
        run: |
          mac_out=$(./target/release/holler token mint --label macos-client)
          mac_id=$(echo "$mac_out" | awk -F': *' '/^token_id:/ {print $2}')
          mac_secret=$(echo "$mac_out" | awk -F': *' '/^secret:/ {print $2}')
          echo "::add-mask::${mac_secret}"
          echo "macos_token=${mac_id}:${mac_secret}" >> "$GITHUB_OUTPUT"

          win_out=$(./target/release/holler token mint --label windows-client)
          win_id=$(echo "$win_out" | awk -F': *' '/^token_id:/ {print $2}')
          win_secret=$(echo "$win_out" | awk -F': *' '/^secret:/ {print $2}')
          echo "::add-mask::${win_secret}"
          echo "windows_token=${win_id}:${win_secret}" >> "$GITHUB_OUTPUT"

      # GitHub Actions has no native "wait until a dependent job is done"
      # signal for a job that already produced its outputs and is now
      # just idling — see issue #94's design comment. A fixed, documented
      # sleep is the accepted answer: budgeted generously for both client
      # jobs' checkout + build + join + run to reach a live presence
      # frame, not real coordination.
      - name: Wait for client jobs to join and start their sessions
        run: sleep 360

      - name: Verify macOS session joined (poll the roster)
        run: |
          for i in $(seq 1 30); do
            ./target/release/holler roster --json | grep -q '"macos-session"' && break
            sleep 2
          done
          ./target/release/holler roster
          ./target/release/holler roster --json | grep -q '"macos-session"' \
            || { echo "::error::macos-session never appeared on the roster"; exit 1; }

      # `say`/`roster`/`interrupt` reach a live `holler serve` over its
      # local Unix-domain control socket (src/wire/control.rs) — private
      # to this machine's HOLLER_STATE_DIR, not reachable over the
      # network the tunnel exposes. So the actual protocol-level
      # verification runs here, on the same machine as the live server,
      # not on the client legs.
      - name: Exercise say/interrupt against the macOS session
        run: |
          ./target/release/holler say macos-session "ping from linux-server"
          ./target/release/holler interrupt macos-session

      # Known, already-accepted limitation (holler-client#60): holler-client
      # does not currently compile on Windows at all, so windows-client
      # (below) is expected to fail before it ever joins. Best-effort only
      # — never fails this job.
      - name: Verify Windows session (best-effort — see holler-client#60)
        continue-on-error: true
        run: |
          for i in $(seq 1 15); do
            ./target/release/holler roster --json | grep -q '"windows-session"' && break
            sleep 2
          done
          ./target/release/holler roster
          ./target/release/holler roster --json | grep -q '"windows-session"'

      - name: Exercise say/interrupt against the Windows session (best-effort)
        continue-on-error: true
        run: |
          ./target/release/holler say windows-session "ping from linux-server"
          ./target/release/holler interrupt windows-session

      - name: Stop cloudflared and holler serve
        if: always()
        run: |
          kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          kill "$(cat /tmp/holler-serve.pid)" 2>/dev/null || true

  macos-client:
    needs: linux-server
    runs-on: macos-latest
    steps:
      # TEMPORARY, for this harness's own verification only (issue #94):
      # pinned to the TLS fix branch (Performant-Labs/holler-client#66)
      # instead of holler-client's default branch, because holler-client
      # cannot dial wss:// at all without it (tokio-tungstenite had no TLS
      # feature enabled — see holler-client#65). Flip `ref` back to the
      # default branch once #66 merges.
      - uses: actions/checkout@v4
        with:
          repository: Performant-Labs/holler-client
          ref: fix/65-tls-feature

      - name: Install Rust
        run: rustup toolchain install stable

      - name: Build holler-client
        run: cargo build --release

      - name: Join the tunneled server
        run: |
          tunnel_url="${{ needs.linux-server.outputs.tunnel_url }}"
          # The tunnel terminates TLS on 443; Holler's own --server default
          # port (41807) does not apply here, so the port must be explicit.
          wss_url="wss://${tunnel_url#https://}:443"
          ./target/release/holler join --server "$wss_url" --token "${{ needs.linux-server.outputs.macos_token }}"

      - name: Write a local sessions.toml (stub-acp fixture, zero-cost)
        run: |
          cat > sessions.toml <<EOF
          [[session]]
          name = "macos-session"
          harness = "stub-acp"
          command = ["$(pwd)/target/release/stub-acp"]
          EOF

      - name: Run in the background and stay alive for the server's verification window
        run: |
          ./target/release/holler run --config sessions.toml > run.log 2>&1 &
          echo $! > run.pid
          sleep 300

      - name: Show run log
        if: always()
        run: cat run.log || true

  windows-client:
    needs: linux-server
    runs-on: windows-latest
    # Known, already-tracked, pre-existing issue (holler-client#60):
    # holler-client does not compile on Windows at all right now
    # (instance_lock.rs unconditionally uses Unix-only APIs), unrelated to
    # this harness. Matches how ci.yml already handles this same gap.
    # Remove once holler-client#60 is fixed.
    continue-on-error: true
    defaults:
      run:
        shell: pwsh
    steps:
      # TEMPORARY — see the identical note on macos-client above
      # (Performant-Labs/holler-client#65 / #66).
      - uses: actions/checkout@v4
        with:
          repository: Performant-Labs/holler-client
          ref: fix/65-tls-feature

      - name: Install Rust
        run: rustup toolchain install stable

      - name: Build holler-client
        run: cargo build --release

      - name: Join the tunneled server
        run: |
          $tunnelUrl = "${{ needs.linux-server.outputs.tunnel_url }}"
          $host_ = $tunnelUrl -replace '^https://', ''
          $wssUrl = "wss://${host_}:443"
          ./target/release/holler.exe join --server $wssUrl --token "${{ needs.linux-server.outputs.windows_token }}"

      - name: Write a local sessions.toml (stub-acp fixture, zero-cost)
        run: |
          $stubPath = (Resolve-Path "target/release/stub-acp.exe").Path -replace '\\', '/'
          @"
          [[session]]
          name = "windows-session"
          harness = "stub-acp"
          command = ["$stubPath"]
          "@ | Set-Content -Path sessions.toml

      - name: Run in the background and stay alive for the server's verification window
        run: |
          Start-Process -FilePath "./target/release/holler.exe" -ArgumentList "run --config sessions.toml" `
            -RedirectStandardOutput "run.log" -RedirectStandardError "run.err.log" -PassThru | Out-Null
          Start-Sleep -Seconds 300

      - name: Show run log
        if: always()
        run: |
          Get-Content run.log -ErrorAction SilentlyContinue
          Get-Content run.err.log -ErrorAction SilentlyContinue
