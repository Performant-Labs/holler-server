name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      # Windows is deliberately OFF the matrix (not soft-failed) as of
      # 2026-09-06 -- a real ~2s connect-refused latency on GitHub's
      # Windows runner butts up against the dial_closed_port_fails_fast
      # canary's <2s budget, and this is being tracked as its own piece
      # of work rather than left as permanent CI noise. Add
      # `windows-latest` back to this list once that's addressed.
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # A docs-only PR (README/CHANGELOG/docs/** with no source, test, or
      # CI-config change) doesn't need a real Rust build/test cycle -- this
      # keeps the job itself as a REQUIRED check that still runs and passes
      # quickly, rather than using `paths-ignore` on the workflow trigger
      # (which would make GitHub never create the check at all, and a
      # required-but-never-created check permanently blocks merging).
      - name: Detect docs-only changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/**'
              - '.github/workflows/**'

      - name: Install Rust
        if: steps.filter.outputs.code == 'true'
        run: rustup toolchain install stable
        shell: pwsh

      # Issue #41: the canary is the first gate. `--test wire_selftest`
      # alone (not `cargo test`, which also builds the lib) so CI goes
      # red as early as possible if the runner ever swallows a failure.
      - name: Canary (fail-fast)
        if: steps.filter.outputs.code == 'true'
        run: cargo test --test wire_selftest
        shell: pwsh

      # Issue #40: the wire harness scaffold (the #31 e2e slots into this).
      # Mirrors the canary step so a broken #40 harness fails CI on its own,
      # rather than only surfacing in the full suite.
      - name: Wire harness scaffold (issue #40)
        if: steps.filter.outputs.code == 'true'
        run: cargo test --test first_talk
        shell: pwsh

      - name: Full test suite
        if: steps.filter.outputs.code == 'true'
        run: cargo test
        shell: pwsh

      # Issue #304: selection logic is dependency-free (stdlib only) so it
      # runs on the runners' preinstalled Ruby (2.6 on macOS) -- no gem install.
      - name: test-run.rb selection (issue #304)
        if: steps.filter.outputs.code == 'true'
        run: ruby scripts/test_selection_test.rb
        shell: pwsh

      - name: Clippy
        if: steps.filter.outputs.code == 'true'
        run: cargo clippy --all-targets -- -D warnings
        shell: pwsh
