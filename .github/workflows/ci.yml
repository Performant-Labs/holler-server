name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable
        shell: pwsh

      # Issue #41: the canary is the first gate. `--test wire_selftest`
      # alone (not `cargo test`, which also builds the lib) so CI goes
      # red as early as possible if the runner ever swallows a failure.
      - name: Canary (fail-fast)
        run: cargo test --test wire_selftest
        shell: pwsh

      - name: Full test suite
        run: cargo test
        shell: pwsh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        shell: pwsh
